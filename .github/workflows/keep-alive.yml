name: Keep Supabase Alive

on:
  schedule:
    # Runs every 2 days at 6:00 AM UTC. Well under Supabase's 7-day pause window,
    # so a single missed run is not a problem.
    - cron: "0 6 */2 * *"
  # Lets you trigger it manually from the Actions tab to test it immediately.
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase REST endpoint
        run: |
          response=$(curl -s -o /dev/null -w "%{http_code}" \
            "${{ secrets.VITE_SUPABASE_URL }}/rest/v1/settings?select=id" \
            -H "apikey: ${{ secrets.VITE_SUPABASE_ANON_KEY }}")
          echo "Response code: $response"
          # Any 2xx means Supabase responded — the request itself is what resets
          # the inactivity timer, regardless of whether RLS allows reading the row.
          if [ "$response" -lt 200 ] || [ "$response" -ge 300 ]; then
            echo "Unexpected response code — failing this run so it shows red, not silently passing."
            exit 1
          fi
